
name: Penguin Legends APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          set -e
          mkdir -p game
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d game
          find game -name project.godot

      - name: Check Godot project
        run: |
          if ! find game -name project.godot | grep -q .; then
            echo "Godot project not found in ZIP"
            exit 1
          fi
          echo "Godot project found"
