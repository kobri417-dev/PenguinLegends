
name: Penguin Legends Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    env:
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      ANDROID_HOME: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y curl unzip ca-certificates openjdk-17-jdk

          SDKMANAGER="$(find /usr/lib/android-sdk /opt /root \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p /tmp/android-cli
            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/android-cli.zip
            unzip -oq /tmp/android-cli.zip -d /tmp/android-cli
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            cp -a /tmp/android-cli/cmdline-tools/. \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ] || \
             [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then
            curl -fL \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
              -o /tmp/godot-templates.tpz
            mkdir -p /tmp/godot-templates
            unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates
            SOURCE="$(find /tmp/godot-templates \
              -type f -name android_debug.apk -printf '%h\n' | head -n 1)"
            test -n "$SOURCE"
            cp -a "$SOURCE/." "$TEMPLATE_DIR/"
          fi

      - name: Locate project
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f PenguinLegends3D_Android_Project_v04.zip ]; then
            mkdir -p game
            unzip -oq PenguinLegends3D_Android_Project_v04.zip -d game
          fi

          PROJECT_FILE="$(find . -name project.godot \
            -not -path './.git/*' | head -n 1)"
          test -n "$PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Configure Godot and signing
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

          keytool -genkeypair -noprompt \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Prepare Android export preset
        shell: bash
        run: |
          set -euxo pipefail

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [ ! -f "$PRESET" ] || ! grep -q 'platform="Android"' "$PRESET"; then
            cat > "$PRESET" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/PenguinLegends.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.kobri417.penguinlegends"
          package/name="Penguin Legends"
          package/signed=true
          EOF
          fi

          mkdir -p "$PROJECT_DIR/build"

          # Android debug signing: all three settings must exist.
          if grep -q '^\[preset\.0\.options\]' "$PRESET"; then
            if ! grep -q '^keystore/debug=' "$PRESET"; then
              printf '\nkeystore/debug="%s"\n' "$HOME/debug.keystore" >> "$PRESET"
            else
              sed -i "s|^keystore/debug=.*|keystore/debug=\"$HOME/debug.keystore\"|" "$PRESET"
            fi

            if ! grep -q '^keystore/debug_user=' "$PRESET"; then
              printf 'keystore/debug_user="androiddebugkey"\n' >> "$PRESET"
            else
              sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' "$PRESET"
            fi

            if ! grep -q '^keystore/debug_password=' "$PRESET"; then
              printf 'keystore/debug_password="android"\n' >> "$PRESET"
            else
              sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|' "$PRESET"
            fi
          else
            echo "ERROR: Android preset has no [preset.0.options] section"
            exit 1
          fi

          echo "===== Android preset ====="
          cat "$PRESET"

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/PenguinLegends.apk" \
            2>&1 | tee /tmp/android-export.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo "===== Export diagnostics ====="
            grep -inE \
              'error|invalid|missing|cannot|could not|sdk|keystore|preset|architecture|template' \
              /tmp/android-export.log | tail -n 150 || true
            tail -n 150 /tmp/android-export.log
            exit "$RESULT"
          fi

          test -s "$PROJECT_DIR/build/PenguinLegends.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PenguinLegends-APK
          path: ${{ env.PROJECT_DIR }}/build/PenguinLegends.apk
          if-no-files-found: error
