
name: Penguin Legends Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      ANDROID_HOME: /usr/lib/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot Android export
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          if [ -d /root/.config/godot ] && [ ! -d "$HOME/.config/godot" ]; then
            cp -a /root/.config/godot "$HOME/.config/"
          fi

          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
            cp -an /root/.local/share/godot/export_templates/4.3.stable/. \
              "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi

          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_SDK_ROOT/build-tools/33.0.2/aapt"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          mkdir -p "$(dirname "$SETTINGS")"
          touch "$SETTINGS"

          if ! grep -q 'export/android/java_sdk_path' "$SETTINGS"; then
            echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$SETTINGS"
          fi

          if ! grep -q 'export/android/android_sdk_path' "$SETTINGS"; then
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$SETTINGS"
          fi

          java -version
          godot --version

      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          test -f PenguinLegends3D_Android_Project_v04.zip
          mkdir -p game
          unzip -oq PenguinLegends3D_Android_Project_v04.zip -d game

          PROJECT_DIR="$(find game -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/project.godot"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project found: $PROJECT_DIR"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euxo pipefail

          KEYSTORE="$HOME/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

          echo "ANDROID_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Create Android export preset
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$PROJECT_DIR/build"

          cat > "$PROJECT_DIR/export_presets.cfg" <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/PenguinLegends.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.kobri417.penguinlegends"
          package/name="Penguin Legends"
          package/signed=true
          keystore/debug="$ANDROID_DEBUG_KEYSTORE"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail

          godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      - name: Validate Android preset
        shell: bash
        run: |
          set -euxo pipefail

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/PenguinLegends.apk" \
            2>&1 | tee /tmp/android-export.log

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          test -s "$PROJECT_DIR/build/PenguinLegends.apk"
          ls -lh "$PROJECT_DIR/build/PenguinLegends.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PenguinLegends-APK
          path: game/**/build/PenguinLegends.apk
          if-no-files-found: error
