
name: Penguin Legends Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    env:
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      ANDROID_HOME: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y curl unzip ca-certificates openjdk-17-jdk python3

          SDKMANAGER="$(find /usr/lib/android-sdk /opt /root -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p /tmp/android-cli
            curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
            unzip -oq /tmp/android-cli.zip -d /tmp/android-cli
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            cp -a /tmp/android-cli/cmdline-tools/. "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          java -version
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -d "$ANDROID_SDK_ROOT/build-tools/34.0.0"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          if [ ! -s "$TEMPLATE_DIR/android_debug.apk" ] || [ ! -s "$TEMPLATE_DIR/android_release.apk" ]; then
            curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot-templates.tpz
            mkdir -p /tmp/godot-templates
            unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates

            SOURCE="$(find /tmp/godot-templates -type f -name android_debug.apk -printf '%h\n' | head -n 1)"
            test -n "$SOURCE"
            cp -a "$SOURCE/." "$TEMPLATE_DIR/"
          fi

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Locate latest project archive
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'PenguinLegends3D_Android_Project_v*.zip' -print | sort -V | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No PenguinLegends3D versioned ZIP found in repository root."
            exit 1
          fi

          echo "Using project archive: $ZIP_FILE"
          mkdir -p game
          unzip -oq "$ZIP_FILE" -d game

          PROJECT_FILE="$(find game -name project.godot -print | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found inside the archive."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$(dirname "$PROJECT_FILE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

          python3 - "$PROJECT_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          section = "[rendering]"
          key = "textures/vram_compression/import_etc2_astc"
          replacement = f"{key}=true"

          start = next(
              (i for i, line in enumerate(lines) if line.strip() == section),
              None
          )

          if start is None:
              lines.extend(["", section, replacement])
          else:
              end = next(
                  (i for i in range(start + 1, len(lines))
                   if lines[i].strip().startswith("[")
                   and lines[i].strip().endswith("]")),
                  len(lines)
              )

              found = False
              for i in range(start + 1, end):
                  if lines[i].strip().startswith(key + "="):
                      lines[i] = replacement
                      found = True

              if not found:
                  lines.insert(end, replacement)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Android texture setting configured.")
          PY

      - name: Configure Godot and Android signing
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

          keytool -genkeypair -noprompt \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          test -s "$HOME/debug.keystore"

      - name: Prepare Android export preset
        shell: bash
        run: |
          set -euxo pipefail

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [ ! -f "$PRESET" ] || ! grep -q 'platform="Android"' "$PRESET"; then
            cat > "$PRESET" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/PenguinLegends.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.kobri417.penguinlegends"
          package/name="Penguin Legends"
          package/signed=true
          EOF
          fi

          mkdir -p "$PROJECT_DIR/build"

          python3 - "$PRESET" "$HOME/debug.keystore" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          keystore = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()

          values = {
              "keystore/debug": keystore,
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          section = "[preset.0.options]"
          start = next(
              (i for i, line in enumerate(lines) if line.strip() == section),
              None
          )

          if start is None:
              raise SystemExit("Missing [preset.0.options]")

          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].strip().startswith("[")
               and lines[i].strip().endswith("]")),
              len(lines)
          )

          for key, value in values.items():
              replacement = f'{key}="{value}"'
              found = False

              for i in range(start + 1, end):
                  if lines[i].strip().startswith(key + "="):
                      lines[i] = replacement
                      found = True

              if not found:
                  lines.insert(end, replacement)
                  end += 1

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Android signing configured.")
          PY

      - name: Import project and check scripts
        shell: bash
        run: |
          set -uo pipefail

          godot --headless --editor --path "$PROJECT_DIR" --quit 2>&1 | tee /tmp/godot-import.log
          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            cat /tmp/godot-import.log
            exit "$RESULT"
          fi

          if grep -inE 'SCRIPT ERROR:|Parse Error:|Failed to load script|Compile Error:' /tmp/godot-import.log; then
            echo "ERROR: Godot script errors found during import."
            exit 1
          fi

      - name: Validate project scripts
        shell: bash
        run: |
          set -uo pipefail

          godot --headless --path "$PROJECT_DIR" --editor --quit 2>&1 | tee /tmp/godot-validate.log
          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            cat /tmp/godot-validate.log
            exit "$RESULT"
          fi

          if grep -inE 'SCRIPT ERROR:|Parse Error:|Failed to load script|Compile Error:' /tmp/godot-validate.log; then
            echo "ERROR: Godot script errors found. APK export cancelled."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$PROJECT_DIR/build"

          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/PenguinLegends.apk" \
            2>&1 | tee /tmp/android-export.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            grep -inE 'error|invalid|missing|cannot|could not|sdk|keystore|preset|architecture|template|texture|ETC2|ASTC|SCRIPT ERROR|Parse Error' /tmp/android-export.log | tail -n 200 || true
            tail -n 200 /tmp/android-export.log
            exit "$RESULT"
          fi

          if grep -inE 'SCRIPT ERROR:|Parse Error:|Failed to load script|Compile Error:' /tmp/android-export.log; then
            echo "ERROR: Script errors found during export."
            exit 1
          fi

          test -s "$PROJECT_DIR/build/PenguinLegends.apk"
          ls -lh "$PROJECT_DIR/build/PenguinLegends.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PenguinLegends-APK
          path: ${{ env.PROJECT_DIR }}/build/PenguinLegends.apk
          if-no-files-found: error
