
name: Penguin Legends Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android SDK requirements
        run: |
          set -eu

          SDK="/usr/lib/android-sdk"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          test -x "$SDK/build-tools/34.0.0/aapt"
          test -x "$JAVA_HOME/bin/java"

      - name: Configure Godot Android export
        run: |
          set -eu

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          cp -a /root/.local/share/godot/export_templates/4.3.stable \
            "$HOME/.local/share/godot/export_templates/"

          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Extract project
        run: |
          set -eu
          mkdir -p game
          unzip -q PenguinLegends3D_Android_Project_v04.zip -d game
          PROJECT_DIR="$(find game -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create Android export preset
        run: |
          set -eu

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/PenguinLegends.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.kobri417.penguinlegends"
          package/name="Penguin Legends"
          package/signed=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          mkdir -p "$PROJECT_DIR/build"

      - name: Import project
        run: |
          godot --headless --path "$PROJECT_DIR" --editor --quit

      - name: Export APK
        run: |
          set -eu
          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/PenguinLegends.apk"
          test -s "$PROJECT_DIR/build/PenguinLegends.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PenguinLegends-APK
          path: game/**/build/PenguinLegends.apk
          if-no-files-found: error
