
name: Penguin Legends Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    env:
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      ANDROID_HOME: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update
          apt-get install -y curl unzip ca-certificates openjdk-17-jdk

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" /opt /root \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            cd /tmp
            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o android-commandline-tools.zip

            mkdir -p /tmp/android-cli
            unzip -oq android-commandline-tools.zip -d /tmp/android-cli

            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            cp -a /tmp/android-cli/cmdline-tools/. \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          java -version

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ] || \
             [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then
            curl -fL \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
              -o /tmp/godot-templates.tpz

            mkdir -p /tmp/godot-templates
            unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates

            TEMPLATE_SOURCE="$(find /tmp/godot-templates \
              -type d -name '4.3.stable' | head -n 1)"

            if [ -n "$TEMPLATE_SOURCE" ]; then
              cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DIR/"
            else
              TEMPLATE_SOURCE="$(find /tmp/godot-templates \
                -type f -name android_debug.apk -printf '%h\n' | head -n 1)"
              test -n "$TEMPLATE_SOURCE"
              cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DIR/"
            fi
          fi

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Find Godot project
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f PenguinLegends3D_Android_Project_v04.zip ]; then
            mkdir -p game
            unzip -oq PenguinLegends3D_Android_Project_v04.zip -d game
          fi

          PROJECT_FILE="$(find . -name project.godot \
            -not -path './.git/*' | head -n 1)"

          test -n "$PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project: $PROJECT_DIR"

      - name: Configure Android signing
        shell: bash
        run: |
          set -euxo pipefail

          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$PROJECT_DIR/export_presets.cfg" <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/PenguinLegends.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          version/target_sdk=34
          version/min_sdk=23
          package/unique_name="com.kobri417.penguinlegends"
          package/name="Penguin Legends"
          package/signed=true
          keystore/debug="$HOME/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          mkdir -p "$PROJECT_DIR/build"

      - name: Import Godot project
        shell: bash
        run: |
          set -euxo pipefail

          godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/PenguinLegends.apk" \
            2>&1 | tee /tmp/android-export.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo "Android export failed. Last log lines:"
            tail -n 100 /tmp/android-export.log
            exit "$RESULT"
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          test -s "$PROJECT_DIR/build/PenguinLegends.apk"
          ls -lh "$PROJECT_DIR/build/PenguinLegends.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PenguinLegends-APK
          path: ${{ env.PROJECT_DIR }}/build/PenguinLegends.apk
          if-no-files-found: error
