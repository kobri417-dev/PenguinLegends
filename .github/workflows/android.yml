
name: Build Penguin Legends 3D APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Files in repository:"
          ls -la
          echo "Searching for Godot project:"
          find . -name project.godot

      - name: Check project
        run: |
          if ! find . -name project.godot | grep -q .; then
            echo "ERROR: No Godot project found. ZIP may need to be extracted."
            exit 1
          fi
